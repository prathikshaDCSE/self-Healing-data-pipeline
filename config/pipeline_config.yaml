# pipeline_config.yaml
# Ground-truth expectations for the dataset. Interns' pipelines/agents should
# validate against this file (or hardcode equivalent checks) - it's the
# contract the agent is enforcing.
#
# Ranges below assume the default generator settings:
#   --customers 500 --products 60 --orders-per-day 300 --events-per-day 1200
# Recompute if you change generator args for a cohort.

datasets:
  customers:
    source: csv
    path_pattern: "customers.csv"
    primary_key: customer_id
    expected_row_count:
      min: 480
      max: 520
    schema:
      customer_id: string
      name: string
      email: string
      region: string
      signup_date: date
    freshness_sla: null

  products:
    source: csv
    path_pattern: "products.csv"
    primary_key: product_id
    expected_row_count:
      min: 55
      max: 65
    schema:
      product_id: string
      name: string
      category: string
      price: float
    freshness_sla: null

  orders:
    source: csv
    path_pattern: "orders/orders_{date}.csv"
    primary_key: order_id
    foreign_keys:
      customer_id: customers.customer_id
      product_id: products.product_id
    expected_row_count_per_batch:
      min: 240
      max: 360
    schema:
      order_id: string
      customer_id: string
      product_id: string
      order_ts: timestamp
      quantity: integer
      order_total: float
      status: string
    null_tolerance:
      order_total: 0.02
      customer_id: 0.0
    freshness_sla:
      max_delay_hours: 26

  events:
    source: mock_api
    path_pattern: "events/events_{date}.jsonl"
    primary_key: event_id
    foreign_keys:
      customer_id: customers.customer_id
    expected_row_count_per_batch:
      min: 900
      max: 1500
    schema:
      event_id: string
      customer_id: string
      event_type: string
      session_id: string
      event_ts: timestamp
    freshness_sla:
      max_delay_hours: 6

bigquery:
  project_id: "river-pillar-506507-b4"
  dataset: "pipeline_prathiksha"
  location: "US"
  tables:
    customers: "dim_customers"
    products: "dim_products"
    orders: "fct_orders"
    events: "fct_events"

agent:
  remediation_policy:
    duplicate_ingestion: auto_fix
    volume_anomaly_spike: auto_fix
    schema_drift: escalate
    volume_anomaly_drop: escalate
    null_spike: escalate
    referential_break: escalate
    staleness: escalate
